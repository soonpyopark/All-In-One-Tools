<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>플로팅 런처</title>
    <style>
      :root {
        color-scheme: dark;
        --bar: rgba(36, 40, 48, 0.92);
        --bar-dim: rgba(36, 40, 48, 0.55);
        --text: #f3f4f6;
        --muted: #9ca3af;
        --line: rgba(255, 255, 255, 0.12);
        --dash: rgba(156, 163, 175, 0.55);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
        user-select: none;
      }
      body {
        display: flex;
        /* 창 왼쪽·아래에 바를 붙여, 접을 때 왼쪽으로 빨려가지 않게 함 */
        align-items: flex-end;
        justify-content: flex-start;
        padding: 10px 14px 16px;
      }
      #bar {
        display: inline-flex;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        min-height: 100px;
        max-width: 100%;
        padding: 12px 14px 10px 10px;
        border-radius: 18px;
        background: var(--bar);
        cursor: grab;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.18),
          0 6px 16px rgba(0, 0, 0, 0.22);
        transition:
          background 160ms ease,
          opacity 160ms ease,
          padding 220ms cubic-bezier(0.22, 1, 0.36, 1),
          border-radius 220ms cubic-bezier(0.22, 1, 0.36, 1),
          min-height 220ms cubic-bezier(0.22, 1, 0.36, 1),
          gap 220ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #bar.dragging-window {
        cursor: grabbing;
      }
      #bar.dim {
        background: var(--bar-dim);
      }
      #bar.drop-over {
        background: rgba(37, 99, 235, 0.42);
        box-shadow:
          0 0 0 2px rgba(147, 197, 253, 0.95),
          0 6px 16px rgba(0, 0, 0, 0.22);
      }
      #row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      #handle {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3px;
        width: 14px;
        padding: 6px 4px;
        cursor: grab;
        opacity: 0.55;
        flex: 0 0 auto;
        border-radius: 8px;
        transition:
          width 220ms cubic-bezier(0.22, 1, 0.36, 1),
          padding 220ms cubic-bezier(0.22, 1, 0.36, 1),
          opacity 160ms ease,
          background 160ms ease;
      }
      #handle:active {
        cursor: grabbing;
      }
      #handle:hover {
        opacity: 0.9;
        background: rgba(255, 255, 255, 0.06);
      }
      #handle span {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #d1d5db;
      }
      #row > :not(#handle) {
        transform-origin: left center;
        transition:
          opacity 150ms ease,
          transform 200ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      /* 접히기 직전: 아이콘 페이드 아웃 */
      #bar.is-collapsing #row > :not(#handle) {
        opacity: 0;
        transform: translateX(-8px) scale(0.96);
        pointer-events: none;
      }
      /* 펼친 직후: 아이콘 페이드 인 */
      #bar.is-expanding #row > :not(#handle) {
        opacity: 0;
        transform: translateX(-8px) scale(0.96);
        pointer-events: none;
      }
      /* 접힘: 핸들 알약만 남김 */
      #bar.collapsed {
        min-height: 0;
        padding: 10px 12px;
        border-radius: 14px;
        gap: 0;
      }
      #bar.collapsed #row > :not(#handle) {
        display: none !important;
      }
      #bar.collapsed #handle {
        width: 22px;
        padding: 12px 7px;
        opacity: 0.9;
        cursor: pointer;
      }
      .page-nav {
        width: 22px;
        height: 48px;
        flex: 0 0 auto;
        border: 0;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--muted);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        padding: 0;
      }
      .page-nav:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.12);
        color: var(--text);
      }
      .page-nav:disabled {
        opacity: 0.25;
        cursor: default;
      }
      #bar:not(.multi-page) .page-nav {
        display: none;
      }
      #stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      #items {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        /* 상단 ✎/× 배지가 잘리지 않도록 visible 유지 (페이지는 slice로만 표시) */
        overflow: visible;
        padding-top: 6px;
      }
      #dots {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 5px;
        min-height: 8px;
      }
      #bar.multi-page #dots {
        display: flex;
      }
      .dot {
        width: 6px;
        height: 6px;
        border: 0;
        border-radius: 50%;
        padding: 0;
        background: rgba(156, 163, 175, 0.45);
        cursor: pointer;
      }
      .dot.active {
        background: #e5e7eb;
        transform: scale(1.15);
      }
      .item {
        position: relative;
        width: 64px;
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        border: 0;
        padding: 0;
        background: transparent;
        color: var(--text);
        cursor: pointer;
      }
      .item:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .item.dragging {
        opacity: 0.45;
      }
      .item.drag-over {
        outline: 2px dashed #93c5fd;
        outline-offset: 2px;
        border-radius: 12px;
      }
      /* 빈 바로가기 칸 (+): 끌어다 놓기·클릭 추가 안내 */
      .item.slot {
        cursor: copy;
      }
      .item.slot .glyph {
        border: 1.5px dashed rgba(156, 163, 175, 0.42);
        background: rgba(255, 255, 255, 0.03);
        box-shadow: none;
        color: rgba(156, 163, 175, 0.85);
        font-size: 22px;
        font-weight: 500;
        line-height: 1;
      }
      .item.slot .label {
        color: var(--muted);
      }
      .item.slot:hover .glyph {
        border-color: rgba(147, 197, 253, 0.65);
        color: #bfdbfe;
        background: rgba(59, 130, 246, 0.14);
      }
      #bar.drop-over .item.slot .glyph {
        border-color: #93c5fd;
        color: #bfdbfe;
        background: rgba(59, 130, 246, 0.2);
      }
      .glyph {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        background: linear-gradient(145deg, #94a3b8, #334155);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      }
      .label {
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: center;
        font-size: 11px;
        line-height: 1.2;
        color: var(--text);
      }
      .actions {
        position: absolute;
        top: 0;
        right: -2px;
        z-index: 2;
        display: none;
        gap: 2px;
      }
      .item:hover .actions {
        display: flex;
      }
      .actions button {
        width: 16px;
        height: 16px;
        border: 0;
        border-radius: 4px;
        font-size: 10px;
        line-height: 1;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.92);
        color: #374151;
        padding: 0;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      }
      .actions button.del {
        color: #dc2626;
        font-weight: 700;
      }
      .divider {
        width: 1px;
        align-self: stretch;
        margin: 8px 2px;
        background: var(--line);
        flex: 0 0 auto;
      }
      /* 추가 안내(?) — 클릭 시 도움말, 바 위에 끌어다 놓기로 추가 */
      .add {
        width: 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        border: 0;
        padding: 0;
        background: transparent;
        color: var(--muted);
        cursor: help;
        flex: 0 0 auto;
      }
      .add .glyph {
        border: 1.5px solid rgba(156, 163, 175, 0.35);
        background: rgba(255, 255, 255, 0.04);
        box-shadow: none;
        color: var(--muted);
        font-size: 20px;
        font-weight: 600;
        transition: border-color 160ms ease, color 160ms ease, background 160ms ease;
      }
      .add .label {
        width: 100%;
        text-align: center;
        font-size: 11px;
        line-height: 1.2;
        color: var(--muted);
      }
      .add:hover .glyph {
        border-color: rgba(209, 213, 219, 0.55);
        color: var(--text);
        background: rgba(255, 255, 255, 0.08);
      }
      #bar.drop-over .add .glyph {
        border-color: #93c5fd;
        color: #bfdbfe;
        background: rgba(59, 130, 246, 0.22);
      }
      .empty {
        color: var(--muted);
        font-size: 12px;
        padding: 0 8px;
      }
      #bar.hide-help .divider,
      #bar.hide-help #addHint {
        display: none !important;
      }
      /* 도움: ? 버튼 위 · 아이콘 열(5/7/10) 너비에 맞춤 */
      #helpPanel {
        display: none;
        position: relative;
        flex-direction: column;
        gap: 8px;
        align-self: stretch;
        width: 100%;
        box-sizing: border-box;
        margin: 0 0 2px;
        padding: 10px 12px 9px;
        border-radius: 12px;
        background: rgba(28, 32, 40, 0.98);
        border: 1px solid var(--line);
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.2),
          0 10px 24px rgba(0, 0, 0, 0.35);
        animation: helpIn 170ms cubic-bezier(0.22, 1, 0.36, 1);
        z-index: 3;
      }
      #helpPanel::after {
        content: '';
        position: absolute;
        right: 28px;
        bottom: -5px;
        width: 9px;
        height: 9px;
        background: rgba(28, 32, 40, 0.98);
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        transform: rotate(45deg);
      }
      #bar.help-open #helpPanel {
        display: flex;
      }
      #bar.help-open #addHint .glyph {
        border-color: rgba(147, 197, 253, 0.55);
        color: #bfdbfe;
        background: rgba(59, 130, 246, 0.2);
      }
      #bar.collapsed #helpPanel {
        display: none !important;
      }
      @keyframes helpIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .help-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 0 2px;
      }
      .help-title {
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.02em;
        color: var(--text);
      }
      .help-close {
        width: 22px;
        height: 22px;
        border: 0;
        border-radius: 7px;
        padding: 0;
        background: rgba(255, 255, 255, 0.06);
        color: var(--muted);
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
      }
      .help-close:hover {
        background: rgba(255, 255, 255, 0.12);
        color: var(--text);
      }
      .help-tips {
        display: grid;
        grid-template-columns: 1fr;
        gap: 2px;
      }
      .tip {
        display: grid;
        grid-template-columns: 36px 1fr;
        gap: 8px;
        align-items: baseline;
        padding: 7px 8px;
        border-radius: 8px;
        min-width: 0;
      }
      .tip:hover {
        background: rgba(255, 255, 255, 0.05);
      }
      .tip-k {
        font-size: 11px;
        font-weight: 650;
        color: #bfdbfe;
      }
      .tip-v {
        font-size: 11px;
        line-height: 1.4;
        color: #e5e7eb;
      }
      .help-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 2px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
      }
      .help-foot label.hide {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--muted);
        cursor: pointer;
        user-select: none;
      }
      .help-foot label.hide input {
        accent-color: #60a5fa;
      }
      .help-foot .ok {
        border: 0;
        border-radius: 8px;
        padding: 6px 14px;
        background: rgba(96, 165, 250, 0.22);
        color: #dbeafe;
        font-size: 12px;
        font-weight: 650;
        cursor: pointer;
      }
      .help-foot .ok:hover {
        background: rgba(96, 165, 250, 0.32);
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <div id="helpPanel" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
        <div class="help-head">
          <span class="help-title" id="helpTitle">사용 방법</span>
          <button type="button" class="help-close" id="helpClose" title="닫기" aria-label="닫기">
            ×
          </button>
        </div>
        <div class="help-tips">
          <div class="tip">
            <span class="tip-k">추가</span>
            <span class="tip-v">프로그램·바로가기·폴더·파일을 바에 끌어다 놓기</span>
          </div>
          <div class="tip">
            <span class="tip-k">순서</span>
            <span class="tip-v">아이콘을 끌어 배치 변경</span>
          </div>
          <div class="tip">
            <span class="tip-k">접기</span>
            <span class="tip-v">왼쪽 점 6개 클릭 · 끌어서 위치 이동</span>
          </div>
          <div class="tip">
            <span class="tip-k">메뉴</span>
            <span class="tip-v">우클릭으로 열 수·불투명도·도움말 표시 등</span>
          </div>
        </div>
        <div class="help-foot">
          <label class="hide">
            <input type="checkbox" id="hideHelpCheck" />
            도움말 숨기기
          </label>
          <button type="button" class="ok" id="helpOk">확인</button>
        </div>
      </div>
      <div id="row">
        <div
          id="handle"
          title="클릭하여 접기 · 끌어서 이동"
          aria-label="클릭하여 접기 또는 끌어서 이동"
          role="button"
        >
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <button type="button" class="page-nav" id="prevPage" title="이전 페이지" aria-label="이전 페이지">
          ‹
        </button>
        <div id="stage">
          <div id="items"></div>
          <div id="dots" role="tablist" aria-label="페이지"></div>
        </div>
        <button type="button" class="page-nav" id="nextPage" title="다음 페이지" aria-label="다음 페이지">
          ›
        </button>
        <div class="divider" id="helpDivider" aria-hidden="true"></div>
        <button
          type="button"
          class="add"
          id="addHint"
          title="추가·순서 변경·접기(왼쪽 점) 안내"
          aria-label="사용 방법 안내"
        >
          <span class="glyph">?</span>
          <span class="label">도움말</span>
        </button>
      </div>
    </div>
    <script>
      const bridge = window.floatingLauncher;
      const bar = document.getElementById('bar');
      const itemsEl = document.getElementById('items');
      const dotsEl = document.getElementById('dots');
      const handle = document.getElementById('handle');
      const addHint = document.getElementById('addHint');
      const prevPageBtn = document.getElementById('prevPage');
      const nextPageBtn = document.getElementById('nextPage');
      const stage = document.getElementById('stage');
      const helpPanel = document.getElementById('helpPanel');
      const hideHelpCheck = document.getElementById('hideHelpCheck');
      const helpOk = document.getElementById('helpOk');
      const helpClose = document.getElementById('helpClose');

      /** 항목이 적을 때 기본으로 채울 빈 칸(+) 수 */
      const EMPTY_SLOTS = 5;

      let items = [];
      let settings = {
        opacity: 1,
        sharpenOnHover: true,
        collapsed: false,
        hideHelp: false,
        columns: 5,
      };

      /** 한 줄(페이지)에 보이는 아이콘 열 수 — 우클릭 메뉴에서 5/7/10 선택 */
      function pageSize() {
        const n = Number(settings.columns);
        return n === 7 || n === 10 ? n : 5;
      }
      let busyId = null;
      let drag = null;
      let addingDrops = false;
      let dropDepth = 0;
      let reorderId = null;
      let skipNextOpen = false;
      let pageIndex = 0;
      /** 창 드래그가 실제로 움직였는지 (핸들 클릭 접기 구분용) */
      let windowDragMoved = false;
      /** 이번 포인터 다운이 핸들에서 시작했는지 */
      let dragFromHandle = false;

      const COLOR_PALETTE = {
        rose: ['#f472b6', '#ef4444'],
        amber: ['#fbbf24', '#f97316'],
        green: ['#4ade80', '#16a34a'],
        sky: ['#38bdf8', '#2563eb'],
        violet: ['#a78bfa', '#7c3aed'],
        cyan: ['#22d3ee', '#0891b2'],
        orange: ['#fb923c', '#c2410c'],
        pink: ['#f9a8d4', '#db2777'],
        lime: ['#a3e635', '#65a30d'],
        indigo: ['#818cf8', '#4338ca'],
        teal: ['#2dd4bf', '#0f766e'],
        slate: ['#94a3b8', '#334155'],
      };

      /** @param {{ color?: string, colorFrom?: string, colorTo?: string }} item */
      function glyphBackground(item) {
        if (item.colorFrom && item.colorTo) {
          return `linear-gradient(145deg, ${item.colorFrom}, ${item.colorTo})`;
        }
        const pair = COLOR_PALETTE[item.color] || COLOR_PALETTE.slate;
        return `linear-gradient(145deg, ${pair[0]}, ${pair[1]})`;
      }

      function pageCount() {
        const size = pageSize();
        return Math.max(1, Math.ceil(items.length / size) || 1);
      }

      function clampPage() {
        const max = pageCount() - 1;
        if (pageIndex > max) pageIndex = max;
        if (pageIndex < 0) pageIndex = 0;
      }

      function pageItems() {
        const size = pageSize();
        const start = pageIndex * size;
        return items.slice(start, start + size);
      }

      function isExternalAddDrag(event) {
        if (reorderId) return false;
        const types = [...(event.dataTransfer?.types ?? [])];
        if (types.includes('application/x-alltools-launcher-id')) return false;
        return (
          types.includes('Files') ||
          types.includes('text/uri-list') ||
          types.includes('text/plain')
        );
      }

      /**
       * @param {string} fromId
       * @param {string} toId
       */
      async function moveItemBefore(fromId, toId) {
        if (!fromId || !toId || fromId === toId) return;
        const ids = items.map((entry) => entry.id);
        const from = ids.indexOf(fromId);
        const to = ids.indexOf(toId);
        if (from < 0 || to < 0) return;
        const next = [...items];
        const [moved] = next.splice(from, 1);
        next.splice(to, 0, moved);
        items = next;
        // 이동한 아이콘이 있는 페이지로 유지
        const movedIndex = next.findIndex((entry) => entry.id === fromId);
        if (movedIndex >= 0) pageIndex = Math.floor(movedIndex / pageSize());
        render();
        try {
          const res = await bridge.api('launcher.save', { items: next });
          if (Array.isArray(res?.items)) {
            items = res.items;
            clampPage();
            render();
          }
        } catch (err) {
          window.alert(err instanceof Error ? err.message : '순서를 저장하지 못했습니다.');
        }
      }

      function clearDragOver() {
        for (const node of itemsEl.querySelectorAll('.item.drag-over')) {
          node.classList.remove('drag-over');
        }
      }

      function pathFromFileUrl(href) {
        try {
          const url = new URL(href);
          if (url.protocol !== 'file:') return '';
          let filePath = decodeURIComponent(url.pathname || '');
          if (/^\/[A-Za-z]:\//.test(filePath)) filePath = filePath.slice(1);
          return filePath.replace(/\//g, '\\');
        } catch {
          return '';
        }
      }

      /** @param {DragEvent} event */
      function entriesFromDrop(event) {
        /** @type {string[]} */
        const out = [];
        const files = [...(event.dataTransfer?.files ?? [])];
        for (const file of files) {
          const filePath = bridge.getPathForFile?.(file);
          if (filePath) out.push(filePath);
        }

        const uriList = String(event.dataTransfer?.getData('text/uri-list') || '');
        for (const line of uriList.split(/\r?\n/)) {
          const text = line.trim();
          if (!text || text.startsWith('#')) continue;
          if (/^https?:\/\//i.test(text)) {
            out.push(text);
            continue;
          }
          if (/^file:\/\//i.test(text)) {
            const filePath = pathFromFileUrl(text);
            if (filePath) out.push(filePath);
          }
        }

        const plain = String(event.dataTransfer?.getData('text/plain') || '').trim();
        if (/^https?:\/\//i.test(plain)) out.push(plain);
        if (/^file:\/\//i.test(plain)) {
          const filePath = pathFromFileUrl(plain);
          if (filePath) out.push(filePath);
        }

        return [...new Set(out.filter(Boolean))];
      }

      function setDropOver(on) {
        bar.classList.toggle('drop-over', Boolean(on));
      }

      /** @param {DragEvent} event */
      async function addDroppedEntries(event) {
        if (addingDrops) return;
        const paths = entriesFromDrop(event);
        setDropOver(false);
        dropDepth = 0;
        if (paths.length === 0) return;

        addingDrops = true;
        try {
          const res = await bridge.api('launcher.addFromPaths', { paths });
          if (Array.isArray(res?.items)) {
            items = res.items;
            // 새로 추가된 항목이 있는 마지막 페이지로
            pageIndex = pageCount() - 1;
            render();
          }
        } catch (err) {
          window.alert(err instanceof Error ? err.message : '끌어다 놓은 항목을 추가하지 못했습니다.');
        } finally {
          addingDrops = false;
        }
      }

      function applyCollapsedUi() {
        const collapsed = Boolean(settings.collapsed);
        bar.classList.toggle('collapsed', collapsed);
        handle.title = collapsed
          ? '클릭하여 펼치기 · 끌어서 이동'
          : '클릭하여 접기 · 끌어서 이동';
        handle.setAttribute(
          'aria-label',
          collapsed ? '클릭하여 펼치기 또는 끌어서 이동' : '클릭하여 접기 또는 끌어서 이동',
        );
        handle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      }

      function applyHelpUi() {
        bar.classList.toggle('hide-help', Boolean(settings.hideHelp));
      }

      function openHelpModal() {
        if (settings.collapsed) return;
        hideHelpCheck.checked = false;
        bar.classList.add('help-open');
        bridge.requestResize();
      }

      function closeHelpModal() {
        if (!bar.classList.contains('help-open')) return;
        bar.classList.remove('help-open');
        bridge.requestResize();
      }

      /** 접기/펼치기 애니메이션 중이면 중복 토글 무시 */
      let collapseAnimating = false;

      function toggleCollapsed() {
        if (collapseAnimating) return;
        const next = !settings.collapsed;
        collapseAnimating = true;

        if (next) {
          // 접기: 도움 닫고 → 아이콘 페이드 → collapsed → 창 축소 애니메이션
          closeHelpModal();
          bar.classList.add('is-collapsing');
          window.setTimeout(() => {
            settings = { ...settings, collapsed: true };
            bar.classList.remove('is-collapsing');
            applyCollapsedUi();
            bridge.setCollapsed(true);
            window.setTimeout(() => {
              collapseAnimating = false;
            }, 260);
          }, 150);
          return;
        }

        // 펼치기: 내용 표시 → 창 확대 애니메이션 → 아이콘 페이드 인
        settings = { ...settings, collapsed: false };
        applyCollapsedUi();
        clampPage();
        render();
        bar.classList.add('is-expanding');
        bridge.setCollapsed(false);
        // 창 확대(약 80+220ms) 후에 아이콘이 나타나게
        window.setTimeout(() => {
          bar.classList.remove('is-expanding');
        }, 200);
        window.setTimeout(() => {
          collapseAnimating = false;
        }, 360);
      }

      function applyDim() {
        const base = Number(settings.opacity) || 1;
        if (settings.sharpenOnHover) {
          bar.classList.add('dim');
          bar.style.opacity = String(base);
        } else {
          bar.classList.remove('dim');
          bar.style.opacity = String(base);
        }
      }

      function applyHover(on) {
        const base = Number(settings.opacity) || 1;
        if (!settings.sharpenOnHover) {
          bar.classList.remove('dim');
          bar.style.opacity = String(base);
          bridge.setHover(on);
          return;
        }
        if (on) {
          bar.classList.remove('dim');
          bar.style.opacity = '1';
        } else {
          bar.classList.add('dim');
          bar.style.opacity = String(base);
        }
        bridge.setHover(on);
      }

      function goToPage(next) {
        const max = pageCount() - 1;
        pageIndex = Math.min(max, Math.max(0, next));
        render();
        // 페이지마다 아이콘 수가 달라 창 너비를 다시 맞춤 (잘림·빈 여백 방지)
        requestAnimationFrame(() => bridge.requestResize());
      }

      function renderPager() {
        const total = pageCount();
        // 아이콘이 10개를 넘을 때만 점·좌우 화살표 표시
        const multi = items.length > pageSize();
        bar.classList.toggle('multi-page', multi);
        prevPageBtn.disabled = !multi || pageIndex <= 0;
        nextPageBtn.disabled = !multi || pageIndex >= total - 1;

        dotsEl.innerHTML = '';
        if (!multi) return;
        for (let i = 0; i < total; i += 1) {
          const dot = document.createElement('button');
          dot.type = 'button';
          dot.className = `dot${i === pageIndex ? ' active' : ''}`;
          dot.title = `${i + 1} / ${total}`;
          dot.setAttribute('aria-label', `${i + 1}페이지`);
          dot.setAttribute('aria-current', i === pageIndex ? 'true' : 'false');
          dot.addEventListener('click', (event) => {
            event.stopPropagation();
            goToPage(i);
          });
          dotsEl.appendChild(dot);
        }
      }

      function appendEmptySlot() {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'item slot';
        btn.title = '클릭하여 추가 · 파일·바로가기를 여기로 끌어다 놓기';
        btn.setAttribute('aria-label', '바로가기 추가');

        const glyph = document.createElement('span');
        glyph.className = 'glyph';
        glyph.textContent = '+';
        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = '추가';

        btn.appendChild(glyph);
        btn.appendChild(label);
        btn.addEventListener('click', (event) => {
          event.stopPropagation();
          void pickAddShortcut();
        });
        itemsEl.appendChild(btn);
      }

      async function pickAddShortcut() {
        try {
          const res = await bridge.api('launcher.floating.pickAdd', {});
          if (res?.cancelled) return;
          if (Array.isArray(res?.items)) {
            items = res.items;
            clampPage();
            render();
            requestAnimationFrame(() => bridge.requestResize());
          }
        } catch {
          /* ignore */
        }
      }

      function render() {
        clampPage();
        itemsEl.innerHTML = '';
        renderPager();

        for (const item of pageItems()) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'item';
          btn.draggable = busyId !== item.id;
          btn.disabled = busyId === item.id;
          btn.title = `${item.title || '바로가기'}\n끌어서 순서 변경 · 클릭하여 실행`;
          btn.dataset.id = item.id;

          const actions = document.createElement('div');
          actions.className = 'actions';
          const edit = document.createElement('button');
          edit.type = 'button';
          edit.draggable = false;
          edit.title = '메인 런처에서 편집';
          edit.textContent = '✎';
          edit.addEventListener('click', (event) => {
            event.stopPropagation();
            void bridge.api('launcher.floating.edit', { id: item.id });
          });
          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'del';
          del.draggable = false;
          del.title = '삭제';
          del.textContent = '×';
          del.addEventListener('click', async (event) => {
            event.stopPropagation();
            try {
              const res = await bridge.api('launcher.floating.remove', { id: item.id });
              if (res?.cancelled) return;
              items = Array.isArray(res?.items) ? res.items : items.filter((entry) => entry.id !== item.id);
              clampPage();
              render();
            } catch {
              /* ignore */
            }
          });
          actions.appendChild(edit);
          actions.appendChild(del);

          const glyph = document.createElement('span');
          glyph.className = 'glyph';
          glyph.textContent = item.icon || '💻';
          glyph.style.background = glyphBackground(item);
          const label = document.createElement('span');
          label.className = 'label';
          label.textContent = item.title || '바로가기';

          btn.appendChild(actions);
          btn.appendChild(glyph);
          btn.appendChild(label);

          btn.addEventListener('dragstart', (event) => {
            reorderId = item.id;
            skipNextOpen = false;
            btn.classList.add('dragging');
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('application/x-alltools-launcher-id', item.id);
            event.dataTransfer.setData('text/plain', item.id);
          });
          btn.addEventListener('dragend', () => {
            reorderId = null;
            btn.classList.remove('dragging');
            clearDragOver();
            setDropOver(false);
            dropDepth = 0;
          });
          btn.addEventListener('dragover', (event) => {
            if (!reorderId || reorderId === item.id) return;
            event.preventDefault();
            event.stopPropagation();
            event.dataTransfer.dropEffect = 'move';
            clearDragOver();
            btn.classList.add('drag-over');
          });
          btn.addEventListener('dragleave', (event) => {
            if (event.currentTarget.contains(/** @type {Node} */ (event.relatedTarget))) return;
            btn.classList.remove('drag-over');
          });
          btn.addEventListener('drop', (event) => {
            if (!reorderId) return;
            event.preventDefault();
            event.stopPropagation();
            btn.classList.remove('drag-over');
            const fromId =
              event.dataTransfer.getData('application/x-alltools-launcher-id') || reorderId;
            if (!fromId || fromId === item.id) return;
            skipNextOpen = true;
            void moveItemBefore(fromId, item.id);
          });

          btn.addEventListener('click', async () => {
            if (skipNextOpen) {
              skipNextOpen = false;
              return;
            }
            if (busyId) return;
            busyId = item.id;
            render();
            try {
              await bridge.api('launcher.open', { id: item.id });
            } finally {
              busyId = null;
              render();
            }
          });
          itemsEl.appendChild(btn);
        }

        // 등록 항목이 5개 미만이면 나머지 칸을 + 빈칸으로 채움 (첫 사용 안내)
        if (items.length < EMPTY_SLOTS && pageIndex === pageCount() - 1) {
          const blanks = EMPTY_SLOTS - items.length;
          for (let i = 0; i < blanks; i += 1) appendEmptySlot();
        }
      }

      function canDragWindow(event) {
        const el = event.target;
        if (!(el instanceof Element)) return false;
        if (el.closest('.item, .add, .actions, #addHint, .page-nav, .dot, #helpPanel')) return false;
        return Boolean(el.closest('#bar'));
      }

      bar.addEventListener('pointerdown', (event) => {
        if (event.button !== 0) return;
        if (!canDragWindow(event)) return;
        drag = { x: event.screenX, y: event.screenY };
        windowDragMoved = false;
        dragFromHandle = Boolean(event.target instanceof Element && event.target.closest('#handle'));
        bar.classList.add('dragging-window');
        bar.setPointerCapture(event.pointerId);
      });
      bar.addEventListener('pointermove', (event) => {
        if (!drag) return;
        const dx = event.screenX - drag.x;
        const dy = event.screenY - drag.y;
        drag = { x: event.screenX, y: event.screenY };
        if (dx || dy) {
          if (Math.abs(dx) + Math.abs(dy) >= 3) windowDragMoved = true;
          bridge.moveBy(dx, dy);
        }
      });
      const endWindowDrag = (event) => {
        if (!drag) return;
        const fromHandle = dragFromHandle;
        const moved = windowDragMoved;
        drag = null;
        dragFromHandle = false;
        windowDragMoved = false;
        bar.classList.remove('dragging-window');
        bridge.moveEnd();
        // 핸들을 클릭만 했을 때 접기/펼치기 (드래그와 구분)
        if (fromHandle && !moved && event?.type === 'pointerup') {
          toggleCollapsed();
        }
      };
      bar.addEventListener('pointerup', endWindowDrag);
      bar.addEventListener('pointercancel', endWindowDrag);

      bar.addEventListener('mouseenter', () => applyHover(true));
      bar.addEventListener('mouseleave', () => applyHover(false));
      bar.addEventListener('contextmenu', (event) => {
        event.preventDefault();
        bridge.contextMenu();
      });

      prevPageBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        goToPage(pageIndex - 1);
      });
      nextPageBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        goToPage(pageIndex + 1);
      });

      stage.addEventListener(
        'wheel',
        (event) => {
          if (pageCount() <= 1) return;
          if (Math.abs(event.deltaY) < 2 && Math.abs(event.deltaX) < 2) return;
          event.preventDefault();
          const delta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
          if (delta > 0) goToPage(pageIndex + 1);
          else if (delta < 0) goToPage(pageIndex - 1);
        },
        { passive: false },
      );

      addHint.addEventListener('click', (event) => {
        event.stopPropagation();
        if (bar.classList.contains('help-open')) closeHelpModal();
        else openHelpModal();
      });
      helpClose.addEventListener('click', (event) => {
        event.stopPropagation();
        closeHelpModal();
      });
      helpOk.addEventListener('click', (event) => {
        event.stopPropagation();
        const hide = Boolean(hideHelpCheck.checked);
        closeHelpModal();
        if (hide) {
          settings = { ...settings, hideHelp: true };
          applyHelpUi();
          bridge.setHideHelp(true);
        }
      });
      helpPanel.addEventListener('pointerdown', (event) => {
        event.stopPropagation();
      });

      const dropRoot = document.body;
      dropRoot.addEventListener('dragenter', (event) => {
        if (!isExternalAddDrag(event)) return;
        event.preventDefault();
        event.stopPropagation();
        dropDepth += 1;
        setDropOver(true);
        applyHover(true);
        // 접힌 채 파일을 끌어오면 펼쳐서 드롭 가능하게 (호버 깜빡임과 달리 드롭 종료까지 유지)
        if (settings.collapsed && dropDepth === 1) {
          settings = { ...settings, collapsed: false };
          applyCollapsedUi();
          bridge.setCollapsed(false);
        }
      });
      dropRoot.addEventListener('dragover', (event) => {
        if (!isExternalAddDrag(event)) return;
        event.preventDefault();
        event.stopPropagation();
        event.dataTransfer.dropEffect = 'copy';
        setDropOver(true);
      });
      dropRoot.addEventListener('dragleave', (event) => {
        if (!isExternalAddDrag(event)) return;
        event.preventDefault();
        dropDepth = Math.max(0, dropDepth - 1);
        if (dropDepth === 0) setDropOver(false);
      });
      dropRoot.addEventListener('drop', (event) => {
        if (!isExternalAddDrag(event)) return;
        event.preventDefault();
        event.stopPropagation();
        void addDroppedEntries(event);
      });

      bridge.onItems((payload) => {
        items = Array.isArray(payload?.items) ? payload.items : [];
        clampPage();
        render();
      });
      bridge.onSettings((payload) => {
        const wasCollapsed = Boolean(settings.collapsed);
        const prevColumns = pageSize();
        settings = { ...settings, ...(payload || {}) };
        applyDim();
        applyCollapsedUi();
        applyHelpUi();
        const columnsChanged = prevColumns !== pageSize();
        // 우클릭으로 열 수 변경·펼치기 시 다시 그림 (리사이즈는 메인이 담당)
        if (columnsChanged || (wasCollapsed && !settings.collapsed)) {
          clampPage();
          render();
        }
      });

      applyDim();
      applyCollapsedUi();
      applyHelpUi();
      render();
      bridge.ready();
    </script>
  </body>
</html>
